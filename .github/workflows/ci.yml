name: AlphaLab CI

on:
  push:
    branches: [ mlops ]
  pull_request:
    branches: [ mlops ]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  DVC_CACHE_DIR: .dvc/cache

jobs:

  # ── Job 1: Lint & Tests ──────────────────────────────────────────────────────
  test:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Cache pip downloads — speeds up subsequent runs significantly
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest
        run: |
          pytest src/tests/ \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7


  # ── Job 2: DVC Pipeline ──────────────────────────────────────────────────────
  dvc-repro:
    name: DVC Repro
    runs-on: ubuntu-latest
    needs: test          # only run if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      # Cache DVC local cache — avoids re-running unchanged pipeline stages
      - name: Cache DVC local cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DVC_CACHE_DIR }}
          key: dvc-${{ runner.os }}-${{ hashFiles('dvc.lock') }}
          restore-keys: |
            dvc-${{ runner.os }}-

      - name: Install dependencies + DVC
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

      - name: Configure DVC local remote
        run: |
          # Use a local directory as DVC remote inside CI
          # Since there's no external remote, we run with --no-run-cache
          # so DVC uses the checked-in dvc.lock to validate stages
          mkdir -p /tmp/dvc-remote
          dvc remote add --default localremote /tmp/dvc-remote
          dvc remote list

      - name: DVC repro (reproduce pipeline)
        run: |
          dvc repro --no-run-cache --allow-missing
        env:
          PYTHONPATH: ${{ github.workspace }}/src

      - name: Check DVC status
        run: dvc status

      - name: Upload DVC repro artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dvc-outputs
          path: |
            data/features/
            data/processed/
          retention-days: 3


  # ── Job 3: Docker Build Check ────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test          # only if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false          # build only, no push to registry
          tags: alphalab-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image exists
        run: docker images alphalab-api:ci-${{ github.sha }}


  # ── Job 4: CI Summary ────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test, dvc-repro, docker-build]
    if: always()

    steps:
      - name: Print CI result
        run: |
          echo "=== AlphaLab CI Summary ==="
          echo "Tests:        ${{ needs.test.result }}"
          echo "DVC Repro:    ${{ needs.dvc-repro.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "Branch:       ${{ github.ref_name }}"
          echo "Commit:       ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"

          # Fail the summary job if any required job failed
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [[ "${{ needs.dvc-repro.result }}" != "success" ]]; then
            echo "❌ DVC repro failed"
            exit 1
          fi
          echo "✅ All CI checks passed"