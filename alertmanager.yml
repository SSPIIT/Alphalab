global:
  resolve_timeout: 5m

# ── Routing ───────────────────────────────────────────────────────────────────
route:
  group_by: ["alertname", "severity"]
  group_wait: 30s          # wait before sending first alert in a group
  group_interval: 5m       # how long to wait before sending new alerts in same group
  repeat_interval: 1h      # resend if still firing after 1 hour
  receiver: "alphalab-log" # default receiver

  routes:
    # Critical alerts fire immediately, repeat every 15 min
    - match:
        severity: critical
      receiver: "alphalab-log"
      group_wait: 10s
      repeat_interval: 15m

    # Info-level alerts deduplicated aggressively
    - match:
        severity: info
      receiver: "alphalab-log"
      repeat_interval: 6h

# ── Receivers ─────────────────────────────────────────────────────────────────
receivers:
  - name: "alphalab-log"
    webhook_configs:
      # Logs alert payload to a simple local webhook (see alert_webhook.py)
      # This records fired alerts to logs/alerts.log for demo/grading purposes
      - url: "http://api:8000/internal/alert-webhook"
        send_resolved: true
        max_alerts: 20

# ── Inhibition rules ──────────────────────────────────────────────────────────
# Suppress warning-level alerts when a critical alert is already firing
# for the same endpoint — avoids alert noise
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "instance"]