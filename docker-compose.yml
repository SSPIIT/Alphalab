version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# AlphaLab — docker-compose.yml
#
# WHAT THIS FILE DOES:
#   Defines every service that AlphaLab needs to run.
#   One command — `docker-compose up` — starts all of them together.
#
# SERVICES AT A GLANCE:
#   postgres    → Database used internally by Airflow to track DAG runs
#   airflow     → Orchestrator — runs our daily data pipeline on a schedule
#   mlflow      → Experiment tracker — logs every factor backtest result
#   prometheus  → Metrics collector — scrapes numbers from FastAPI
#   grafana     → Dashboard — visualises what Prometheus collected
#   backend     → FastAPI app — our REST API (built in Week 4)
#   frontend    → React app — the 4-tab dashboard (built in Week 4)
#
# PORTS (what opens in your browser):
#   Airflow   → http://localhost:8080
#   MLflow    → http://localhost:5000
#   Grafana   → http://localhost:3001
#   Backend   → http://localhost:8000
#   Frontend  → http://localhost:3000
# ─────────────────────────────────────────────────────────────────────────────

services:
  
  # ── 1. PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql  # creates mlflow db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. Apache Airflow ─────────────────────────────────────────────────────
  airflow:
    build: ./airflow
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: "46BKJoQYlPPOexq0OhDZnIlNepKFf87WFwLt0nfdstY="
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "True"
      _AIRFLOW_DB_MIGRATE: "True"
      _AIRFLOW_WWW_USER_CREATE: "True"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      AIRFLOW__SIMPLE_AUTH_MANAGER__PASSWORDS: "admin:admin"
      MLFLOW_TRACKING_URI: http://mlflow:5000   # ← so Airflow tasks can log to MLflow
    volumes:
      - ./src/ingestion:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./airflow_passwords.json:/opt/airflow/passwords.json
      - ~/.ssh:/home/airflow/.ssh:ro
      - ./:/opt/airflow/project
    ports:
      - "8080:8080"
    command: airflow standalone
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── 3. MLflow ─────────────────────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://airflow:airflow@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /mlflow/artifacts
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    entrypoint: >
      bash -c "pip install psycopg2-binary --quiet &&
      mlflow server
      --backend-store-uri postgresql+psycopg2://airflow:airflow@postgres:5432/mlflow
      --default-artifact-root /mlflow/artifacts
      --serve-artifacts
      --artifacts-destination /mlflow/artifacts
      --host 0.0.0.0
      --port 5000"
    # env_file:
    # - .env
  # ── 4. Prometheus ─────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
    - ./prometheus.yml:/etc/prometheus/prometheus.yml
    - ./alerts:/etc/prometheus/alerts:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  # ── 5. Grafana ────────────────────────────────────────────────────────────
  # grafana:
  #   image: grafana/grafana:10.4.0
  #   depends_on:
  #     - prometheus
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: admin
  #     GF_USERS_ALLOW_SIGN_UP: "false"
  #   volumes:
  #     - grafana_data:/var/lib/grafana
# ─────────────────────────────────────────────────────────────────────────────
# ADD these two services to your existing docker-compose.yml
# under the `services:` key
# ─────────────────────────────────────────────────────────────────────────────

  grafana:
    image: grafana/grafana:10.4.2
    container_name: alphalab-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=alphalab123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/alphalab_dashboard.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    # networks:
    #   - alphalab-network

# ─────────────────────────────────────────────────────────────────────────────
# ADD this under the `volumes:` key
# ─────────────────────────────────────────────────────────────────────────────
# volumes:
#   grafana_data:

# ─────────────────────────────────────────────────────────────────────────────
# ADD THIS SERVICE to your existing docker-compose.yml
# under the `services:` key, alongside prometheus and grafana
# ─────────────────────────────────────────────────────────────────────────────

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alphalab-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.listen-address=:9093"
    # networks:
    #   - alphalab-network    # use whatever network name your compose already defines

# ─────────────────────────────────────────────────────────────────────────────
# ALSO update your existing prometheus service volumes block to mount
# the alerts folder. Add this line under prometheus volumes:
# ─────────────────────────────────────────────────────────────────────────────
#
#   prometheus:
#     volumes:
#       - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
#       - ./alerts:/etc/prometheus/alerts:ro          ← ADD THIS LINE
#
# And make sure prometheus.yml rule_files path matches:
#   rule_files:
#     - "alerts/alphalab_alerts.yml"
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# 1. ADD this service under `services:` in your docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────

  api:
    build:
      context: .          # Alphalab/ project root
      dockerfile: Dockerfile
    container_name: alphalab-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Mount data directory so updated parquets are picked up without rebuild
      - ./data:/app/data:ro
    # networks:
    #   - alphalab-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ─────────────────────────────────────────────────────────────────────────────
# 2. Your prometheus.yml scrape config is already correct:
#
#   - job_name: "alphalab_api"
#     static_configs:
#       - targets: ["api:8000"]   ← "api" = container name above, resolves inside Docker network
#
#    No change needed there.
# ─────────────────────────────────────────────────────────────────────────────
  # ── 6. Backend (FastAPI) ── uncomment in Week 4 ───────────────────────────
  # backend:
  #   build: ./src/api
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - ./data:/app/data
  #     - ./models:/app/models
  #   depends_on:
  #     - mlflow
  #   environment:
  #     MLFLOW_TRACKING_URI: http://mlflow:5000

  # ── 7. Frontend (React) ── uncomment in Week 4 ────────────────────────────
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - backend

# ── Named volumes ──────────────────────────────────────────────────────────
# ✅ Top-level, zero indentation — all named volumes declared here
volumes:
  postgres_data:
  mlflow_artifacts:    # ← added (was missing, causing the validation error)
  grafana_data: