global:
  scrape_interval: 15s
  evaluation_interval: 15s      # how often to evaluate alert rules
  scrape_timeout: 10s

# ── Alertmanager connection ───────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ── Alert rule files ──────────────────────────────────────────────────────────
rule_files:
  - "alerts/alphalab_alerts.yml"

# ── Scrape configs ────────────────────────────────────────────────────────────
scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alphalab_api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]      # FastAPI container name in docker-compose
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "alphalab-api"

  - job_name: "airflow"
    metrics_path: /metrics
    static_configs:
      - targets: ["airflow-webserver:8080"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]